services:
  db:
    image: postgres:15
    container_name: whisper_postgres
    restart: always
    environment:
      # These credentials must match your .env file
      POSTGRES_USER: whisper
      POSTGRES_PASSWORD: whisperpass
      POSTGRES_DB: whisper_db
    ports:
      - "5001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  bot:
    build: .
    container_name: whisper_bot
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./downloads:/code/downloads

volumes:
  postgres_data: