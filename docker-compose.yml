services:
  db:
    image: postgres:15
    container_name: whisper_postgres
    restart: always
    environment:
      # These credentials must match your .env file
      POSTGRES_USER: whisper
      POSTGRES_PASSWORD: whisperpass
      POSTGRES_DB: whisper_db
    ports:
      - "5001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  bot:
    build: .
    container_name: whisper_bot
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./downloads:/code/downloads
      - telegram_api_data:/var/lib/telegram-bot-api:ro

  telegram-api:
    image: aiogram/telegram-bot-api:latest
    profiles: [large-media]
    restart: always
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_api_data:/var/lib/telegram-bot-api

volumes:
  postgres_data:
  telegram_api_data:
