services:
  db:
    image: postgres:15
    container_name: whisper_postgres
    restart: always
    environment:
      # These credentials must match your .env file
      POSTGRES_USER: whisper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whisperpass} # Development only.
      POSTGRES_DB: whisper_db
    ports:
      - "127.0.0.1:5001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  bot:
    build: .
    container_name: whisper_bot
    restart: always
    group_add: ["101"]
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - downloads:/code/downloads
      - telegram_api_data:/var/lib/telegram-bot-api:ro

  telegram-api:
    image: aiogram/telegram-bot-api@sha256:13612626f031fe154fbcd6dbdfc945b6debdb2a02b51ed02b6a5df09c46bced7
    profiles: [large-media]
    restart: always
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_api_data:/var/lib/telegram-bot-api

  telegram-cleanup:
    build: .
    profiles: [large-media]
    restart: unless-stopped
    user: "101:101"
    command: [python, -m, app.cleanup]
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the development database URL}
      MEDIA_TELEGRAM_LOCAL_ROOT: /var/lib/telegram-bot-api
      CLEANUP_WORKERS:
      CLEANUP_SCAN_SECONDS:
      CLEANUP_RECONCILE_SECONDS:
      CLEANUP_LEASE_SECONDS:
      CLEANUP_RETRY_SECONDS:
      CLEANUP_RETRY_MAX_SECONDS:
      CLEANUP_ORPHAN_GUARD_SECONDS:
    volumes:
      - telegram_api_data:/var/lib/telegram-bot-api

volumes:
  downloads:
  postgres_data:
  telegram_api_data:
